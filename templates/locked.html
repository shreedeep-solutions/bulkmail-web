<!DOCTYPE html>
<html lang="en">
<head>

<title>Access Denied</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=DM+Sans&display=swap" rel="stylesheet">
<style>

  .icon { font-size:4rem; margin-bottom:20px; }
  h1 { font-family:'Syne',sans-serif; font-size:1.8rem; color:#f7506e; margin-bottom:12px; }
  p { color:#6b7280; font-size:0.92rem; line-height:1.7; }
  code { background:#1e2330; border-radius:6px; padding:2px 8px; color:#4f8ef7; font-size:0.88rem; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">🔒</div>
  <h1>Access Denied</h1>
  <p>This application is licensed exclusively for<br>
  <code>bulkemail.shreedeepsolutions.com</code></p>
  <br>
  <p style="color:#3d4354; font-size:0.78rem;">Attempted access from: <code>{{ host }}</code></p>
</div>
</body>
</html>
